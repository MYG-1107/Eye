<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eye Exercise App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Overlay / Welcome Screen -->
  <div id="start-screen" class="overlay">
    <h1>Eye Exercise Assistant</h1>
    <p>Improve eye mobility and reduce strain with guided exercises.</p>
    <button id="start-btn">Start Exercise</button>
  </div>

  <!-- Main Fullscreen Canvas & UI -->
  <div id="app-container" class="hidden">
    <video id="webcam" autoplay playsinline muted class="hidden-video"></video>
    
    <!-- Exercise UI -->
    <div id="exercise-target" class="target"></div>
    <div id="instruction-text">Position your face in front of the camera</div>
    <div id="status-badge">Initializing Face Detector...</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
