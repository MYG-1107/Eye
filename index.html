<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eye Exercise App</title>
  <link rel="stylesheet" href="style.css" />
  <!-- MediaPipe Tasks Vision Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Overlay / Start Screen -->
  <div id="start-screen" class="overlay">
    <h1>Eye Exercise Assistant</h1>
    <p>Follow the green target with your eyes to complete the exercises.</p>
    <button id="start-btn">Start Exercise</button>
    <div id="loading-status" style="margin-top: 15px; font-size: 0.9rem; color: #94a3b8;">Loading AI model...</div>
  </div>

  <!-- Main Exercise View -->
  <div id="app-container" class="hidden">
    <video id="webcam" autoplay playsinline muted class="hidden-video"></video>
    
    <div id="exercise-target" class="target"></div>
    <div id="instruction-text">Position your eyes toward the target</div>

    <!-- Live Tester Debug Panel -->
    <div id="debug-panel">
      <div><strong>Status:</strong> <span id="status-text">Initializing...</span></div>
      <div><strong>Current Gaze:</strong> <span id="gaze-text">NONE</span></div>
      <div><strong>Required Gaze:</strong> <span id="required-text">UP</span></div>
      <div><strong>Hold Progress:</strong> <progress id="hold-progress" value="0" max="100"></progress></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
